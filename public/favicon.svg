<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <path d="M 80 400 C 180 260, 332 260, 432 400" stroke="url(#bridgeGrad)" stroke-width="32" stroke-linecap="round" fill="none" />
  <path d="M 120 400 C 200 310, 312 310, 392 400" stroke="url(#bridgeGrad)" stroke-width="16" stroke-linecap="round" opacity="0.6" fill="none" />
  <!-- Bridge pillars -->
  <line x1="210" y1="310" x2="210" y2="400" stroke="url(#bridgeGrad)" stroke-width="10" stroke-linecap="round" opacity="0.7" />
  <line x1="256" y1="290" x2="256" y2="400" stroke="url(#bridgeGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <line x1="302" y1="310" x2="302" y2="400" stroke="url(#bridgeGrad)" stroke-width="10" stroke-linecap="round" opacity="0.7" />
  <!-- Illuminated Star above bridge -->
  <polygon points="256,90 274,146 333,146 285,181 303,237 256,202 209,237 227,181 179,146 238,146" fill="url(#goldGrad)" />
  <circle cx="256" cy="170" r="8" fill="#ffffff" filter="drop-shadow(0 0 10px #fbbf24)" />
</svg>
